<!doctype html><html><body style="margin:0;background:#888">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const W = 1600, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8aa0b4);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(3, 5, 2); scene.add(sun);
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(q.get("glb"));
scene.add(g.scene);
const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(+(q.get("fov") ?? 50), W / H, 0.05, 200);
const v = (q.get("view") ?? "1,0.4,1").split(",").map(Number), dist = +(q.get("dist") ?? 1);
cam.position.set(c.x + v[0] * s.length() * dist, c.y + v[1] * s.length() * dist, c.z + v[2] * s.length() * dist); cam.lookAt(c);
r.render(scene, cam);
window.done = true;
</script></body></html>
